{{- /*
Shortcode parameters:
- youtubeId (required): YouTube ID (only the alphanumeric part from the URL, e.g. "dQw4w9WgXcQ")
- name (optional): title
*/ -}}

<div style="padding-bottom: 56.25%; position: relative;">
  <iframe style="position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; border: 0px;" width="100%"
          height="100%" src="https://www.youtube-nocookie.com/embed/{{.Get "youtubeId"}}?fs=0&playsinline=1&rel=0"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          title="{{- .Get "name"}}"></iframe>
</div>

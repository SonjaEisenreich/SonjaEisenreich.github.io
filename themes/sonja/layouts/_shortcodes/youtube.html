{{- /*
Shortcode parameters:
- youtubeId (required): YouTube ID (only the alphanumeric part from the URL, e.g. "dQw4w9WgXcQ")
- name (optional): title
*/ -}}

<iframe style="width: 500px; max-width: 100%; margin: 0 10px; aspect-ratio: 16 / 9; display: block; border-radius: 20px"
        width="100%" height="100%"
        src="https://www.youtube-nocookie.com/embed/{{.Get "youtubeId"}}?fs=0&playsinline=1&rel=0"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        title="{{- .Get "name"}}"></iframe>
